# Private repos need one of (both optional; gh-token wins if set):
#   kubectl create secret generic gh-token --from-literal=token=<PAT>
#   kubectl create secret generic gh-app --from-literal=app-id=<app or client ID> --from-file=private-key.pem=<key.pem>
apiVersion: v1
kind: ConfigMap
metadata:
  name: artifact-spec
data:
  # <owner/repo> <tag> <asset-glob> <dest>   (dest ending in / = directory)
  artifacts: |
    myorg/plugin-a v1.0.0 plugin-a-linux-amd64 /out/bin/plugin-a
    myorg/configs  v1.0.0 *.yaml               /out/conf/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retriever-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retriever-demo
  template:
    metadata:
      labels:
        app: retriever-demo
    spec:
      initContainers:
        - name: fetch-artifacts
          image: ghcr.io/pflege-de-labs/retriever:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gh-token
                  key: token
                  # public repos need no token
                  optional: true
            - name: GH_APP_ID
              valueFrom:
                secretKeyRef:
                  name: gh-app
                  key: app-id
                  optional: true
          volumeMounts:
            - name: artifacts
              mountPath: /out
            - name: spec
              mountPath: /config
            - name: gh-app
              mountPath: /gh-app
              readOnly: true
      containers:
        - name: app
          image: ubuntu:24.04
          command: ["/bin/sh", "-c", "ls -lR /opt/artifacts; while true; do sleep 3600; done"]
          volumeMounts:
            - name: artifacts
              mountPath: /opt/artifacts
      volumes:
        - name: artifacts
          emptyDir: {}
        - name: spec
          configMap:
            name: artifact-spec
            # without it a missing ConfigMap keeps the pod from starting
            optional: true
        - name: gh-app
          secret:
            secretName: gh-app
            optional: true
